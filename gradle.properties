org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9.0+ trae "built-in Kotlin"; los plugins de compose y serialization son
# plugins de KGP, así que mantenemos el Kotlin Gradle Plugin clásico (opt-out
# documentado; con android.newDsl=false queda el DSL estable actual).
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
