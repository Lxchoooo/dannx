version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      androidx:
        patterns: ["androidx.*"]
        update-types: ["minor", "patch"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
        update-types: ["minor", "patch"]
      build-tools:
        patterns: ["com.android.tools*", "com.google.*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
