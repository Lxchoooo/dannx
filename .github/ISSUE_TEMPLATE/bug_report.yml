name: Reportar un bug
description: Algo no funciona como esperás en la app
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Cuanto más preciso seas, más rápido se puede arreglar.
  - type: dropdown
    id: version
    attributes:
      label: Versión de la app
      options:
        - "1.4.0"
        - "1.3.0"
        - "1.2.0"
        - "1.1.0"
        - "Otra / no sé"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Modelo de teléfono
      placeholder: Ej. Samsung Galaxy A54
  - type: dropdown
    id: android
    attributes:
      label: Versión de Android
      options:
        - "Android 10"
        - "Android 11"
        - "Android 12"
        - "Android 13"
        - "Android 14"
        - "Android 15 o superior"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      description: Contá qué estabas haciendo y qué mensaje viste, si hubo uno.
      placeholder: Ej. Tocé "Aplicar" y salió "No se pudo aplicar el fondo".
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que pase
  - type: checkboxes
    id: extra
    attributes:
      label: Extra
      options:
        - label: Lo puedo reproducir siempre
        - label: Pasó sin conexión a internet
