name: Apply Supabase migration

# Aplica los .sql de docs/migraciones con la Management API de Supabase.
# Requiere el secret SUPABASE_ACCESS_TOKEN y la variable SUPABASE_PROJECT_REF.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Archivo SQL a aplicar (vacío = todos, en orden alfabético)"
        required: false
        default: ""

concurrency:
  group: supabase-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check configuration
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Faltan SUPABASE_PROJECT_REF (variable) o SUPABASE_ACCESS_TOKEN (secret)."
            exit 1
          fi

      - name: Apply SQL
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SQL_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail

          files=()
          if [ -n "$SQL_FILE" ]; then
            files=("$SQL_FILE")
          else
            while IFS= read -r file; do
              files+=("$file")
            done < <(find docs/migraciones -maxdepth 1 -name '*.sql' | sort)
          fi

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No hay archivos .sql para aplicar."
            exit 1
          fi

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::No existe $file."
              exit 1
            fi
            echo "Aplicando $file"
            jq -Rs '{query: .}' "$file" > payload.json
            status=$(curl -sS -o response.json -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @payload.json)
            echo "HTTP $status"
            cat response.json
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::Supabase rechazó $file (HTTP $status)."
              exit 1
            fi
          done

      - name: Verify schema and security
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          select
              (select count(*)
               from information_schema.columns
               where table_schema = 'public'
                 and table_name = 'collections'
                 and column_name = 'is_public') as is_public_present,
              (select count(*)
               from information_schema.columns
               where table_schema = 'public'
                 and table_name = 'collections'
                 and data_type = 'boolean'
                 and column_name like 'is\_%') as is_columns,
              (select relrowsecurity
               from pg_class c
               join pg_namespace n on n.oid = c.relnamespace
               where n.nspname = 'public' and c.relname = 'collections') as collections_rls,
              (select relrowsecurity
               from pg_class c
               join pg_namespace n on n.oid = c.relnamespace
               where n.nspname = 'public' and c.relname = 'collection_items') as items_rls,
              (select count(*)
               from pg_policies
               where schemaname = 'public'
                 and tablename in ('collections', 'collection_items')
                 and (coalesce(qual, '') like '%is_public%'
                      or coalesce(with_check, '') like '%is_public%')) as policies_with_is_public,
              (select exists (
                 select 1
                 from pg_proc p
                 join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'delete_category'
               )) as delete_category,
              (select count(*)
               from information_schema.columns
               where table_schema = 'public'
                 and table_name = 'wallpapers'
                 and column_name in ('deleted_at', 'deleted_by')) as trash_columns,
              (select relrowsecurity
               from pg_class c
               join pg_namespace n on n.oid = c.relnamespace
               where n.nspname = 'public'
                 and c.relname = 'storage_cleanup_queue') as trash_queue_rls,
              (select count(*)
               from pg_proc p
               join pg_namespace n on n.oid = p.pronamespace
               where n.nspname = 'public'
                 and p.proname in (
                     'bulk_set_featured',
                     'bulk_set_archived',
                     'bulk_set_category',
                     'soft_delete_wallpapers',
                     'restore_wallpapers',
                     'reorder_featured',
                     'purge_expired_wallpapers'
                 )) as trash_rpcs,
              (select relrowsecurity
               from pg_class c
               join pg_namespace n on n.oid = c.relnamespace
               where n.nspname = 'public' and c.relname = 'tag_labels') as tag_labels_rls,
              (select exists (
                 select 1
                 from pg_proc p
                 join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public'
                   and p.proname = 'canonicalize_wallpaper_tags'
               )) as tag_casing_fn,
              (select public.normalize_wallpaper_tags(
                  array['Cleopatra', 'cleopatra'])
                  = array['Cleopatra']) as tag_dedupe_case,
              (select count(*)
               from public.wallpapers w
               where exists (
                   select 1
                   from unnest(coalesce(w.tags, '{}'::text[])) as t(tag)
                   join public.tag_labels l on l.tag = lower(btrim(t.tag))
                   where l.label is distinct from btrim(t.tag)
               )) as tag_spelling_mismatch,
              (select count(*)
               from pg_constraint
               where conrelid = 'public.tag_categories'::regclass
                 and conname in (
                     'tag_categories_tag_shape',
                     'tag_categories_label_match'
                 )) as tag_rule_checks,
              (select count(*)
               from pg_trigger
               where tgrelid = 'public.wallpapers'::regclass
                 and tgname = 'wallpapers_touch_audit') as wallpaper_audit,
              (select count(*)
               from pg_proc p
               join pg_namespace n on n.oid = p.pronamespace
               where n.nspname = 'public'
                 and p.proname in ('prune_tag_labels', 'fail_storage_cleanup')
               ) = 2 as tag_housekeeping;
          SQL
          )
          jq -n --arg q "$query" '{query: $q}' > verify.json
          curl -sS -o verify-response.json \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @verify.json
          cat verify-response.json
          jq -e '.[0]
            | .is_public_present == 1
            and .is_columns == 1
            and .collections_rls
            and .items_rls
            and .policies_with_is_public >= 2
            and .delete_category
            and .trash_columns == 2
            and .trash_queue_rls
            and .trash_rpcs == 7
            and .tag_labels_rls
            and .tag_casing_fn
            and .tag_dedupe_case
            and .tag_spelling_mismatch == 0
            and .tag_rule_checks == 2
            and .wallpaper_audit == 1
            and .tag_housekeeping' verify-response.json > /dev/null
          echo "Esquema y RLS verificados."

      - name: Verify tag behavior
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' scripts/sql/verify_tags.sql > tags.json
          status=$(curl -sS -o tags-response.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @tags.json)
          cat tags-response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Fallaron las comprobaciones de etiquetas (HTTP $status)."
            exit 1
          fi
          if ! grep -q "etiquetas verificadas" tags-response.json; then
            echo "::error::Las comprobaciones de etiquetas no se ejecutaron."
            exit 1
          fi
          echo "Comportamiento de etiquetas verificado."
