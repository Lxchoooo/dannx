name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}

jobs:
  # Modo rápido: APK de prueba en cada push y en cada PR.
  debug:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Sin keystore; el APK debug usará la firma de depuración."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.p12" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DannX-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.p12"

      - name: Remove keystore env
        if: always()
        run: echo "ANDROID_KEYSTORE_PATH=" >> "$GITHUB_ENV"

  # Compuerta de corrección: lint y tests. Corre en paralelo con el build
  # release; la publicación espera a que este job termine bien.
  checks:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  # Build release sin lint ni tests: esas compuertas viven en `checks`.
  # lintVitalRelease se excluye porque lintDebug ya es la compuerta completa.
  build:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease -x lintVitalRelease

      - name: Upload compose reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: compose-reports
          path: app/build/compose-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: DannX-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.p12"

      - name: Remove keystore env
        if: always()
        run: echo "ANDROID_KEYSTORE_PATH=" >> "$GITHUB_ENV"

  # Publica solo después de que lint/tests y el build release hayan pasado.
  publish:
    needs: [checks, build]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release APK
        uses: actions/download-artifact@v7
        with:
          name: DannX-release-${{ github.run_number }}
          path: release

      - name: Publish APK on tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find release -name 'app-release.apk' -print -quit)
          test -n "$APK"
          cp "$APK" DannX.apk
          gh release create "$GITHUB_REF_NAME" DannX.apk \
            --title "DannX $GITHUB_REF_NAME" \
            --notes "Compilado y firmado por GitHub Actions." \
            --verify-tag

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find release -name 'app-release.apk' -print -quit)
          test -n "$APK"
          cp "$APK" DannX.apk
          NOTES="Compilado y firmado por GitHub Actions desde main."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest DannX.apk --clobber
            gh release edit latest --title "DannX · última versión" --notes "$NOTES"
          else
            gh release create latest DannX.apk \
              --target "$GITHUB_SHA" \
              --title "DannX · última versión" \
              --notes "$NOTES"
          fi
