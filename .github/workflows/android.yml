name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon assembleRelease testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: DannX
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk DannX.apk
          gh release create "$GITHUB_REF_NAME" DannX.apk \
            --title "DannX $GITHUB_REF_NAME" \
            --notes "Nueva versión de DannX." \
          || gh release upload "$GITHUB_REF_NAME" DannX.apk --clobber
