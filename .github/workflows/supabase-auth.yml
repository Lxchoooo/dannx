name: Supabase auth settings

# Cambia la configuración de Auth del proyecto con la Management API.
# Requiere el secret SUPABASE_ACCESS_TOKEN y la variable SUPABASE_PROJECT_REF.
on:
  workflow_dispatch:
    inputs:
      disable_signup:
        description: "Deshabilitar el registro público"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check configuration
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Faltan SUPABASE_PROJECT_REF (variable) o SUPABASE_ACCESS_TOKEN (secret)."
            exit 1
          fi

      - name: Update auth settings
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DISABLE_SIGNUP: ${{ inputs.disable_signup }}
        run: |
          set -euo pipefail
          payload=$(jq -n --argjson disable "$DISABLE_SIGNUP" '{disable_signup: $disable}')
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$payload")
          echo "HTTP $status"
          jq '{disable_signup}' response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase rechazó el cambio (HTTP $status)."
            exit 1
          fi

      - name: Verify
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DISABLE_SIGNUP: ${{ inputs.disable_signup }}
        run: |
          set -euo pipefail
          curl -sS -o verify.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $ACCESS_TOKEN"
          jq '{disable_signup}' verify.json
          jq --argjson expected "$DISABLE_SIGNUP" \
            -e '.disable_signup == $expected' verify.json > /dev/null
          echo "Configuración de registro aplicada."
