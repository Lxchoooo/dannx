name: Benchmark

# Solo a mano: un emulador no da números representativos y cada corrida
# cuesta varios minutos. `gh workflow run benchmark.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Macrobenchmark: arranque y fluidez del feed sobre la variante release.
  # También genera el perfil de arranque que se versiona en la app.
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 o superior: desde Android 14 la librería puede reiniciar el
      # estado de compilación entre iteraciones sin reinstalar el APK.
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-default-x86_64

      - name: Create AVD and save snapshot
        id: avd
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: echo "AVD ready to cache."

      - name: Macrobenchmarks on API 34
        if: steps.avd-cache.outputs.cache-hit == 'true' || steps.avd.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -no-audio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: >-
            ./gradlew :benchmark:connectedBenchmarkAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY

      # Genera el Baseline Profile contra la variante sin R8, con nombres
      # legibles que AGP remapea en cada build release. Solo corre el
      # generador: los benchmarks de arranque miden la variante minificada.
      - name: Generate baseline profile on API 34
        if: steps.avd-cache.outputs.cache-hit == 'true' || steps.avd.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -no-audio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: >-
            ./gradlew :benchmark:connectedNonMinifiedReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.dannx.walls.benchmark.BaselineProfileGenerator
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-results
          path: |
            benchmark/build/outputs/connected_android_test_additional_output
            benchmark/build/reports/androidTests/connected
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload generated baseline profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: baseline-profile-generated
          path: benchmark/build/outputs/connected_android_test_additional_output/**/*startup-prof.txt
          if-no-files-found: ignore
          retention-days: 14
