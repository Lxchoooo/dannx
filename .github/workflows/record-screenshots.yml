name: Record screenshots

# Grabación de dorados para Roborazzi. Corre solo a mano, cuando haga falta
# revisar la UI o actualizar las capturas: nunca en push ni en tags, para no
# alargar el CI. Se dispara este workflow, se descarga el artifact
# `screenshots-golden` y se reemplaza app/src/test/screenshots en el repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # Robolectric baja al arrancar un android-all de 151 MB desde Maven
      # Central, y en Actions esa descarga falla de forma intermitente. Si el
      # jar ya está en el repositorio local de Maven, Robolectric lo usa sin
      # tocar la red (MavenArtifactFetcher sale antes de descargar), así que lo
      # dejamos sembrado a mano. Coordenadas según @Config(sdk = [34]) y
      # Robolectric 4.17: al subir cualquiera de los dos hay que actualizarlas.
      - name: Prefetch Robolectric android-all
        run: |
          base="org/robolectric/android-all-instrumented/14-robolectric-10818077-i7"
          jar="android-all-instrumented-14-robolectric-10818077-i7.jar"
          dir="$HOME/.m2/repository/$base"
          mkdir -p "$dir"
          cd "$dir"
          if [ -s "$jar" ]; then
            echo "android-all ya estaba en el repositorio local"
            exit 0
          fi
          for repo in https://repo1.maven.org/maven2 https://repo.maven.apache.org/maven2; do
            if curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 -o "$jar.part" "$repo/$base/$jar"; then
              expected="$(curl -fsSL --retry 3 "$repo/$base/$jar.sha512" | tr -d '[:space:]')"
              actual="$(sha512sum "$jar.part" | cut -d' ' -f1)"
              if [ -n "$expected" ] && [ "$expected" = "$actual" ]; then
                mv "$jar.part" "$jar"
                echo "android-all descargado y verificado"
                exit 0
              fi
              echo "Checksum distinto en $repo, se prueba el siguiente espejo"
            fi
            rm -f "$jar.part"
          done
          echo "::error::No se pudo descargar android-all-instrumented"
          exit 1

      # Sin emulador: los tests de captura corren sobre Robolectric.
      - name: Record golden images
        run: ./gradlew :app:recordRoborazziDebug -Pscreenshots

      # Si Robolectric no puede bajar su android-all, el mensaje completo queda
      # en el reporte; sin esto el log solo muestra el frame del fallo.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshot-test-report
          path: app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload golden images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots-golden
          path: app/src/test/screenshots
          if-no-files-found: error
          retention-days: 14
